      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }

  /v1/stats/leaders:
    get:
      operationId: stats_leaders
      tags: [Stats & Leaders]
      summary: League leaderboards
      description: >
        **Gotcha (confirmed live):** omitting `statGroup` returns multiple
        leader blocks for the same category (e.g. `homeRuns` without
        `statGroup` returns separate `hitting`, `catching`, and `pitching`
        blocks — pitchers can hit home runs off too). Pass `statGroup=hitting`
        explicitly unless you want all of them. For all-time leaders
        (omitting `season`), include `statType=statsSingleSeason` or you'll
        likely get no results.
      parameters:
        - name: leaderCategories
          in: query
          required: true
          schema: { type: string, example: homeRuns }
        - name: playerPool
          in: query
          schema: { type: string }
        - name: leaderGameTypes
          in: query
          schema: { type: string }
        - name: statGroup
          in: query
          schema: { type: string, example: hitting }
        - $ref: '#/components/parameters/Season'
        - name: leagueId
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/SportId'
        - $ref: '#/components/parameters/Hydrate'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Fields'
        - name: statType
          in: query
          schema: { type: string }
      responses:
        "200":
          description: League leaders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatsLeadersResponse' }
              example:
                leagueLeaders:
                  - leaderCategory: "homeRuns"
                    season: "2024"
                    statGroup: "hitting"
                    leaders:
                      - rank: 1
                        value: "58"
                        team: { id: 147, name: "New York Yankees" }
                        league: { id: 103, name: "AL" }
                        person: { id: 592450, fullName: "Aaron Judge" }
                    totalSplits: 522

  /v1/stats/streaks:
    get:
      operationId: stats_streaks
      tags: [Stats & Leaders]
      summary: Hitting/on-base streaks
      description: >
        `streakType`: hittingStreakOverall/Home/Away, onBaseOverall/Home/Away.
        `streakSpan`: career, season, currentStreak, currentStreakInSeason,
        notable, notableInSeason.
      parameters:
        - name: streakType
