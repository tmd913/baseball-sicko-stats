  /v1/{type}:
    get:
      operationId: meta
      tags: [Misc]
      summary: Lookup tables for enum values used by other endpoints
      description: >
        Use this to validate/discover values passed to other endpoints (e.g.
        `group`/`stats` for `team_stats`, `sitCodes` for `stats=statSplits`).
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum:
              - awards
              - baseballStats
              - eventTypes
              - gameStatus
              - gameTypes
              - hitTrajectories
              - jobTypes
              - languages
              - leagueLeaderTypes
              - logicalEvents
              - metrics
              - pitchCodes
              - pitchTypes
              - platforms
              - positions
              - reviewReasons
              - rosterTypes
              - scheduleEventTypes
              - situationCodes
              - sky
              - standingsTypes
              - statGroups
              - statTypes
              - windDirection
      responses:
        "200":
          description: Lookup values
          content:
            application/json:
              schema:
                type: array
                items: { type: object, additionalProperties: true }
