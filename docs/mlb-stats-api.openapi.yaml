openapi: 3.0.3
info:
  title: MLB Stats API
  version: "1.0.0"
  description: >
    OpenAPI description of the public MLB Stats API endpoints wrapped by the
    `MLB-StatsAPI` Python SDK (`../../MLB-StatsAPI/statsapi/endpoints.py`).
    See `mlb-stats-api-endpoints.md` in this folder for prose documentation,
    conventions (`hydrate`, `fields`, response envelope), and worked examples.

    All requests are public, unauthenticated GETs and the API sends
    `Access-Control-Allow-Origin: *`, so "Try it out" below executes real
    requests against the live API from your browser.

    Two endpoints exist in the real API but are NOT included here because
    they require authentication the SDK doesn't support: `v1/analytics` and
    `v1/game/{gamePk}/guids` (Statcast tracking data).
servers:
  - url: https://statsapi.mlb.com/api
tags:
  - name: Game data
    description: Live feed, boxscore, linescore, play-by-play, and other per-game endpoints.
  - name: People
    description: Player bios, stats, free agents, and roster search.
  - name: Teams
    description: Team info, rosters, stats, coaches, and affiliates.
  - name: Schedule
    description: Game schedules, postseason schedules, and tied-game lookups.
  - name: Stats & Leaders
    description: League/team stat queries, leaderboards, and streaks.
  - name: League & Org
    description: Leagues, divisions, sports, seasons, and standings.
  - name: Misc
    description: Attendance, awards, draft, jobs, transactions, venues, and the meta lookup endpoint.

components:
  schemas:
    ApiEnvelope:
      type: object
      description: Every response is wrapped like this; payload key varies per endpoint.
      properties:
        copyright:
          type: string
      additionalProperties: true

    # ── Shared fragments (derived from captured live examples) ──
    IdName:
      type: object
      description: Common stub for team/league/division/venue references.
      properties:
        id: { type: integer }
        name: { type: string }
    PersonStub:
      type: object
      properties:
        id: { type: integer }
        fullName: { type: string }
    CodeDescription:
      type: object
      properties:
        code: { type: string }
        description: { type: string }
    StatLine:
      type: object
      description: Shape observed for both `batting` and `pitching` stat blocks when pruned with `fields`.
      properties:
        runs: { type: integer }
        homeRuns: { type: integer }
        strikeOuts: { type: integer }
        hits: { type: integer }

    # ── Per-endpoint response schemas (endpoints with a captured example) ──
    GameFeedLiveResponse:
      type: object
      properties:
        gameData:
          type: object
          properties:
            game:
              type: object
              properties:
                pk: { type: integer }
            status:
              type: object
              properties:
                detailedState: { type: string }
            teams:
              type: object
              properties:
                away: { type: object, properties: { name: { type: string } } }
                home: { type: object, properties: { name: { type: string } } }
        liveData:
          type: object
          properties:
            plays:
              type: object
              properties:
                currentPlay:
                  type: object
                  properties:
                    result:
                      type: object
                      properties:
                        description: { type: string }
            linescore:
              type: object
              properties:
                innings:
                  type: array
                  items:
                    type: object
                    properties:
                      num: { type: integer }
                      home: { type: object, properties: { runs: { type: integer } } }
                      away: { type: object, properties: { runs: { type: integer } } }
                teams:
                  type: object
                  properties:
                    home: { type: object, properties: { runs: { type: integer } } }
                    away: { type: object, properties: { runs: { type: integer } } }

    BoxscorePlayer:
      type: object
      properties:
        jerseyNumber: { type: string }
        stats:
          type: object
          properties:
            batting: { $ref: '#/components/schemas/StatLine' }
            pitching: { $ref: '#/components/schemas/StatLine' }
        seasonStats:
          type: object
          properties:
            batting: { $ref: '#/components/schemas/StatLine' }
            pitching: { $ref: '#/components/schemas/StatLine' }
    BoxscoreTeamSide:
      type: object
      properties:
        teamStats:
          type: object
          properties:
            batting: { $ref: '#/components/schemas/StatLine' }
            pitching: { $ref: '#/components/schemas/StatLine' }
        players:
          type: object
          description: Keyed by `"ID<personId>"`, e.g. `"ID518617"`.
          additionalProperties:
            $ref: '#/components/schemas/BoxscorePlayer'
    GameBoxscoreResponse:
      type: object
      properties:
        teams:
          type: object
          properties:
            away: { $ref: '#/components/schemas/BoxscoreTeamSide' }
            home: { $ref: '#/components/schemas/BoxscoreTeamSide' }

    Person:
      type: object
      properties:
        id: { type: integer }
        fullName: { type: string }
        primaryPosition:
          type: object
          properties:
            code: { type: string }
            name: { type: string }
            abbreviation: { type: string }
        batSide: { $ref: '#/components/schemas/CodeDescription' }
        pitchHand: { $ref: '#/components/schemas/CodeDescription' }
        mlbDebutDate: { type: string, format: date }
        strikeZoneTop: { type: number }
        strikeZoneBottom: { type: number }
    PersonResponse:
      type: object
      properties:
        people:
          type: array
          description: Always an array, even when looking up a single personId.
          items: { $ref: '#/components/schemas/Person' }

    Team:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        abbreviation: { type: string }
        teamName: { type: string }
        locationName: { type: string }
        venue: { $ref: '#/components/schemas/IdName' }
        league: { $ref: '#/components/schemas/IdName' }
        division: { $ref: '#/components/schemas/IdName' }
        firstYearOfPlay: { type: string }
    TeamResponse:
      type: object
      properties:
        teams:
          type: array
          description: Always an array, even when looking up a single teamId.
          items: { $ref: '#/components/schemas/Team' }

    ScheduleTeamSide:
      type: object
      properties:
        team: { $ref: '#/components/schemas/IdName' }
        score: { type: integer }
        isWinner: { type: boolean }
    ScheduleGame:
      type: object
      properties:
        gamePk: { type: integer }
        gameDate: { type: string, format: date-time }
        status:
          type: object
          properties:
            abstractGameState: { type: string }
            detailedState: { type: string }
        teams:
          type: object
          properties:
            away: { $ref: '#/components/schemas/ScheduleTeamSide' }
            home: { $ref: '#/components/schemas/ScheduleTeamSide' }
    ScheduleDate:
      type: object
      properties:
        date: { type: string, format: date }
        games:
          type: array
          items: { $ref: '#/components/schemas/ScheduleGame' }
    ScheduleResponse:
      type: object
      properties:
        totalItems: { type: integer }
        totalGames: { type: integer }
        dates:
          type: array
          items: { $ref: '#/components/schemas/ScheduleDate' }

    TeamRecord:
      type: object
      properties:
        team: { $ref: '#/components/schemas/IdName' }
        divisionRank: { type: string }
        wins: { type: integer }
        losses: { type: integer }
        gamesBack: { type: string }
        wildCardRank: { type: string }
        wildCardGamesBack: { type: string }
    StandingsRecord:
      type: object
      properties:
        standingsType: { type: string }
        teamRecords:
          type: array
          items: { $ref: '#/components/schemas/TeamRecord' }
    StandingsResponse:
      type: object
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/StandingsRecord' }

    LeaderEntry:
      type: object
      properties:
        rank: { type: integer }
        value: { type: string }
        team: { $ref: '#/components/schemas/IdName' }
        league: { $ref: '#/components/schemas/IdName' }
        person: { $ref: '#/components/schemas/PersonStub' }
    LeaderCategoryBlock:
      type: object
      properties:
        leaderCategory: { type: string }
        season: { type: string }
        statGroup: { type: string }
        leaders:
          type: array
          items: { $ref: '#/components/schemas/LeaderEntry' }
        totalSplits: { type: integer }
    StatsLeadersResponse:
      type: object
      properties:
        leagueLeaders:
          type: array
          items: { $ref: '#/components/schemas/LeaderCategoryBlock' }

  parameters:
    Fields:
      name: fields
      in: query
      schema: { type: string }
      description: Comma-separated allowlist of key names (any nesting depth) to prune the response.
    Hydrate:
      name: hydrate
      in: query
      schema: { type: string }
      description: >
        Comma-separated (or parenthesized/parameterized, e.g. `stats(group=hitting,type=season)`)
        list of sub-objects to embed inline instead of returning just an id + link.
    Season:
      name: season
      in: query
      schema: { type: string, example: "2024" }
    SportId:
      name: sportId
      in: query
      schema: { type: integer, default: 1 }
      description: 1 = MLB. See `meta` type `sportId` values for minor leagues, WBC, etc.
    Limit:
      name: limit
      in: query
      schema: { type: integer }
    GameType:
      name: gameType
      in: query
      schema: { type: string }
      description: e.g. R (regular season), P (postseason), S (spring training)
    Date:
      name: date
      in: query
      schema: { type: string, format: date }
    StartDate:
      name: startDate
      in: query
      schema: { type: string, format: date }
    EndDate:
      name: endDate
      in: query
      schema: { type: string, format: date }
    Timecode:
      name: timecode
      in: query
      schema: { type: string }
      description: Filter the live feed to the state as of this timecode.
    TeamIdPath:
      name: teamId
      in: path
      required: true
      schema: { type: integer, example: 147 }
    PersonIdPath:
      name: personId
      in: path
      required: true
      schema: { type: integer, example: 592450 }
    GamePkPath:
      name: gamePk
      in: path
      required: true
      schema: { type: integer, example: 744834 }
    LeagueIdPath:
      name: leagueId
      in: path
      required: true
      schema: { type: integer, example: 103 }

paths:
  # ── Game data ─────────────────────────────────────────────
  /v1.1/game/{gamePk}/feed/live:
    get:
      operationId: game
      tags: [Game data]
      summary: Full live game feed
      description: >
        The "everything about this game" endpoint — `gameData` (rosters, venue,
        status) + `liveData` (full play-by-play, linescore, boxscore) in one
        tree. Unfiltered this is very large; always use `fields` unless you
        need the whole thing.
      parameters:
        - $ref: '#/components/parameters/GamePkPath'
        - $ref: '#/components/parameters/Timecode'
        - $ref: '#/components/parameters/Hydrate'
        - $ref: '#/components/parameters/Fields'
      responses:
        "200":
          description: Live game feed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameFeedLiveResponse' }
              example:
                gameData:
                  game: { pk: 744834 }
                  status: { detailedState: "Final" }
                  teams:
                    away: { name: "New York Mets" }
                    home: { name: "Washington Nationals" }
                liveData:
                  plays:
                    currentPlay:
                      result: { description: "Brandon Nimmo strikes out swinging." }
                  linescore:
                    innings:
                      - { num: 1, home: { runs: 0 }, away: { runs: 0 } }
                    teams:
                      home: { runs: 1 }
                      away: { runs: 0 }

  /v1.1/game/{gamePk}/feed/live/diffPatch:
    get:
      operationId: game_diff
      tags: [Game data]
      summary: Diff of the live feed between two timecodes
      parameters:
        - $ref: '#/components/parameters/GamePkPath'
        - name: startTimecode
          in: query
          required: true
          schema: { type: string }
        - name: endTimecode
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Diff patch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }

  /v1.1/game/{gamePk}/feed/live/timestamps:
    get:
      operationId: game_timestamps
      tags: [Game data]
      summary: Valid timecodes for a game
      description: Returns an array of timecode strings usable with `game` / `game_diff`.
      parameters:
        - $ref: '#/components/parameters/GamePkPath'
      responses:
        "200":
          description: Array of timecodes
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

  /v1/game/changes:
    get:
      operationId: game_changes
      tags: [Game data]
      summary: Games updated since a timestamp
      parameters:
        - name: updatedSince
          in: query
          required: true
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/SportId'
        - $ref: '#/components/parameters/GameType'
        - $ref: '#/components/parameters/Season'
        - $ref: '#/components/parameters/Fields'
      responses:
        "200":
          description: Changed games
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }

  /v1/game/{gamePk}/contextMetrics:
    get:
      operationId: game_contextMetrics
      tags: [Game data]
      summary: Win probability & context metrics
      parameters:
        - $ref: '#/components/parameters/GamePkPath'
        - $ref: '#/components/parameters/Timecode'
        - $ref: '#/components/parameters/Fields'
      responses:
        "200":
          description: Context metrics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }

  /v1/game/{gamePk}/winProbability:
    get:
      operationId: game_winProbability
      tags: [Game data]
      summary: Win probability by play
      description: For just the current win probability, prefer `game_contextMetrics` instead.
      parameters:
        - $ref: '#/components/parameters/GamePkPath'
        - $ref: '#/components/parameters/Timecode'
        - $ref: '#/components/parameters/Fields'
      responses:
        "200":
          description: Win probability by play
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }

  /v1/game/{gamePk}/boxscore:
    get:
      operationId: game_boxscore
      tags: [Game data]
      summary: Batting/pitching boxscore
      parameters:
        - $ref: '#/components/parameters/GamePkPath'
        - $ref: '#/components/parameters/Timecode'
        - $ref: '#/components/parameters/Fields'
      responses:
        "200":
          description: Boxscore
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameBoxscoreResponse' }
              example:
                teams:
                  away:
                    teamStats:
                      batting: { runs: 0, homeRuns: 0, strikeOuts: 10, hits: 1 }
                      pitching: { runs: 1, homeRuns: 1, strikeOuts: 3, hits: 5 }
                    players:
                      ID518617:
                        jerseyNumber: "30"
                        stats: { batting: {}, pitching: {} }
                        seasonStats:
                          batting: { runs: 0, homeRuns: 0, strikeOuts: 0, hits: 0 }
                          pitching: { runs: 18, homeRuns: 3, strikeOuts: 31, hits: 15 }

  /v1/game/{gamePk}/content:
    get:
      operationId: game_content
      tags: [Game data]
      summary: Media/highlights for a game
      parameters:
        - $ref: '#/components/parameters/GamePkPath'
        - name: highlightLimit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Game content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }

  /v1/game/{gamePk}/feed/color:
    get:
      operationId: game_color
      tags: [Game data]
      summary: Legacy "color" feed variant of the live feed
      parameters:
        - $ref: '#/components/parameters/GamePkPath'
        - $ref: '#/components/parameters/Timecode'
        - $ref: '#/components/parameters/Fields'
      responses:
        "200":
          description: Color feed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }

  /v1/game/{gamePk}/feed/color/diffPatch:
    get:
      operationId: game_color_diff
      tags: [Game data]
      summary: Legacy variant of game_diff
      parameters:
        - $ref: '#/components/parameters/GamePkPath'
        - name: startTimecode
          in: query
          required: true
          schema: { type: string }
        - name: endTimecode
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Color feed diff
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }

  /v1/game/{gamePk}/feed/color/timestamps:
    get:
      operationId: game_color_timestamps
      tags: [Game data]
      summary: Legacy variant of game_timestamps
      parameters:
        - $ref: '#/components/parameters/GamePkPath'
      responses:
        "200":
          description: Array of timecodes
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

  /v1/game/{gamePk}/linescore:
    get:
      operationId: game_linescore
      tags: [Game data]
      summary: Inning-by-inning line score
      parameters:
        - $ref: '#/components/parameters/GamePkPath'
        - $ref: '#/components/parameters/Timecode'
        - $ref: '#/components/parameters/Fields'
      responses:
        "200":
          description: Linescore
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }

  /v1/game/{gamePk}/playByPlay:
    get:
      operationId: game_playByPlay
      tags: [Game data]
      summary: Full play-by-play
      parameters:
        - $ref: '#/components/parameters/GamePkPath'
        - $ref: '#/components/parameters/Timecode'
        - $ref: '#/components/parameters/Fields'
      responses:
        "200":
          description: Play-by-play
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }

  /v1/uniforms/game:
    get:
      operationId: game_uniforms
      tags: [Game data]
      summary: Uniforms worn in given game(s)
      parameters:
        - name: gamePks
          in: query
          required: true
          schema: { type: string }
          description: Comma-separated gamePks.
        - $ref: '#/components/parameters/Fields'
      responses:
        "200":
          description: Uniforms
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }

  /v1/gamePace:
    get:
      operationId: gamePace
      tags: [Game data]
      summary: Pace-of-play stats
      parameters:
        - $ref: '#/components/parameters/Season'
        - name: teamIds
          in: query
          schema: { type: string }
        - name: leagueIds
          in: query
          schema: { type: string }
        - name: leagueListId
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/SportId'
        - $ref: '#/components/parameters/GameType'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - name: venueIds
          in: query
          schema: { type: string }
        - name: orgType
          in: query
          schema: { type: string }
        - name: includeChildren
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Fields'
      responses:
        "200":
          description: Game pace stats
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }

  /v1/highLow/{orgType}:
    get:
      operationId: highLow
      tags: [Game data]
      summary: Statistical high/low extremes
      parameters:
        - name: orgType
          in: path
          required: true
          schema: { type: string, enum: [player, team, division, league, sport, types] }
        - name: statGroup
          in: query
          schema: { type: string }
        - name: sortStat
          in: query
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Season'
        - $ref: '#/components/parameters/GameType'
        - name: teamId
          in: query
          schema: { type: integer }
        - name: leagueId
          in: query
          schema: { type: integer }
        - name: sportIds
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Fields'
      responses:
        "200":
          description: High/low stats
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }

  /v1/homeRunDerby/{gamePk}:
    get:
      operationId: homeRunDerby
      tags: [Game data]
      summary: Home Run Derby results
      parameters:
        - $ref: '#/components/parameters/GamePkPath'
        - $ref: '#/components/parameters/Fields'
      responses:
        "200":
          description: Home Run Derby results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }

  /v1/homeRunDerby/{gamePk}/bracket:
    get:
      operationId: homeRunDerby_bracket
      tags: [Game data]
      summary: Home Run Derby bracket
      parameters:
        - $ref: '#/components/parameters/GamePkPath'
        - $ref: '#/components/parameters/Fields'
      responses:
        "200":
          description: Home Run Derby bracket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }

  /v1/homeRunDerby/{gamePk}/pool:
    get:
      operationId: homeRunDerby_pool
      tags: [Game data]
      summary: Home Run Derby pool
      parameters:
        - $ref: '#/components/parameters/GamePkPath'
        - $ref: '#/components/parameters/Fields'
      responses:
        "200":
          description: Home Run Derby pool
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }

  # ── People ────────────────────────────────────────────────
  /v1/people:
    get:
      operationId: people
      tags: [People]
      summary: Bulk player lookup by ID
      parameters:
        - name: personIds
          in: query
          required: true
          schema: { type: string }
          description: Comma-separated personIds.
        - $ref: '#/components/parameters/Hydrate'
        - $ref: '#/components/parameters/Fields'
      responses:
        "200":
          description: People
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }

  /v1/people/{personId}:
    get:
      operationId: person
      tags: [People]
      summary: Single player bio
      description: >
        No stats included by default — add
        `hydrate=stats(group=[hitting],type=season)` to embed season/career numbers.
      parameters:
        - $ref: '#/components/parameters/PersonIdPath'
        - $ref: '#/components/parameters/Hydrate'
        - $ref: '#/components/parameters/Fields'
      responses:
        "200":
          description: Player bio (always wrapped in a `people` array, even for one ID)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonResponse' }
              example:
                people:
                  - id: 592450
                    fullName: "Aaron Judge"
                    primaryPosition: { code: "9", name: "Outfielder", abbreviation: "RF" }
                    batSide: { code: "R", description: "Right" }
                    pitchHand: { code: "R", description: "Right" }
                    mlbDebutDate: "2016-08-13"
                    strikeZoneTop: 3.523
                    strikeZoneBottom: 1.778

  /v1/people/{personId}/stats/game/{gamePk}:
    get:
      operationId: person_stats
      tags: [People]
      summary: A player's stats for one game
      description: Pass `current` as `gamePk` for a player's in-progress game stats.
      parameters:
        - $ref: '#/components/parameters/PersonIdPath'
        - name: gamePk
          in: path
          required: true
          schema: { type: string, example: "744834" }
        - $ref: '#/components/parameters/Fields'
      responses:
        "200":
          description: Player game stats
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }

  /v1/people/changes:
    get:
      operationId: people_changes
      tags: [People]
      summary: People updated since a timestamp
      parameters:
        - name: updatedSince
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Fields'
      responses:
        "200":
          description: Changed people
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }

  /v1/people/freeAgents:
    get:
      operationId: people_freeAgents
