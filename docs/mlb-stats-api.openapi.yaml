  # ── Schedule ──────────────────────────────────────────────
  /v1/schedule:
    get:
      operationId: schedule
      tags: [Schedule]
      summary: Main schedule query
      description: >
        Requires at least one of `sportId`, `gamePk`, or `gamePks`. Add
        `hydrate=linescore,decisions,probablePitcher(note),broadcasts,seriesStatus`
        to enrich each game inline instead of following `link`s (this is what
        the SDK's `schedule()` convenience function does).
      parameters:
        - name: scheduleType
          in: query
          schema: { type: string }
        - name: eventTypes
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Hydrate'
        - name: teamId
          in: query
          schema: { type: integer }
        - name: leagueId
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/SportId'
        - name: gamePk
          in: query
          schema: { type: integer }
        - name: gamePks
          in: query
          schema: { type: string }
        - name: venueIds
          in: query
          schema: { type: string }
        - name: gameTypes
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Date'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - name: opponentId
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Season'
      responses:
        "200":
          description: Schedule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleResponse' }
              example:
                totalItems: 15
                totalGames: 15
                dates:
                  - date: "2024-07-04"
                    games:
                      - gamePk: 744834
                        gameDate: "2024-07-04T15:05:00Z"
                        status: { abstractGameState: "Final", detailedState: "Final" }
                        teams:
                          away: { team: { id: 121, name: "New York Mets" }, score: 0, isWinner: false }
                          home: { team: { id: 120, name: "Washington Nationals" }, score: 1, isWinner: true }

