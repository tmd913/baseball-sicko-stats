<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- iOS Safari zooms the page in whenever a focused field's font is under
         16px, and never zooms back out afterwards. `maximum-scale=1` suppresses
         that automatic zoom, which lets the roster search keep normal-sized text
         instead of being inflated to 16px (and the tabs beside it with it).
         Applied only on iOS: Safari has ignored the constraint for pinch-zoom
         since iOS 10, so nothing is taken away from the user there, but other
         browsers do honor it and would lose zoom entirely. -->
    <script>
      (function () {
        var ua = navigator.userAgent;
        var iOS =
          /iPad|iPhone|iPod/.test(ua) ||
          (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
        if (!iOS) return;
        var meta = document.querySelector('meta[name="viewport"]');
        if (meta) meta.content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0';
      })();
    </script>
    <meta name="color-scheme" content="dark" />
    <!-- What iOS Safari paints the strips above and below the page with. Dark's
         `--bg` here (the default); the boot script rewrites it before the first
         paint and `theme.ts::applyTheme` on every change — without that the
         strips keep whatever Safari sampled at load. One tag and no `media`, so
         the app's chosen polarity beats the reader's system appearance. Comments
         in this file ship, so the long form is in docs/claude/theming.md. -->
    <meta name="theme-color" content="#121314" />
    <title>Statcast Sicko</title>

    <!-- Tab icon. The SVG is the header's brand mark and is what every current
         browser picks; the .ico carries 16/32px rasters for anything that only
         asks for /favicon.ico, and the touch icon is the home-screen tile
         (square-cornered — iOS rounds it itself). All three live in
         client/public/, which Vite copies to the site root verbatim. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- What makes an added home-screen icon open the app rather than a plain
         Safari tab, and so what the invite page's home-screen tip is promising
         (`LeagueOnboarding.tsx`). Comments in this file ship, so the long form
         — including why `viewport-fit` and the status-bar style are
         deliberately left alone — is in docs/claude/espn-connection.md. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Statcast Sicko" />
    <!-- Paint the base color on the very first frame so a reload doesn't flash
         before the stylesheet loads — and paint the *reader's own* base color,
         which is why this is a script rather than the one rule it used to be.

         `client/src/theme.ts` mirrors the chosen theme into localStorage purely
         so this can run: the saved preference is the server's, and it arrives a
         round trip after the page has painted, so without a local copy the app
         would open in the wrong palette and swap a moment later on every load.
         The values below are each theme's own `--bg`, and they are the one
         place in the app a palette color is written outside the stylesheet.

         Deliberately inline, blocking and tiny: it has to have finished before
         the first paint, and a failed read simply leaves the default.

         It paints the **root**, and `styles.css` clears the root again
         (`html { background: none }`) so that the real background — which is
         `body`'s, and is propagated to the canvas only while the root has none
         — takes over the whole window the moment the stylesheet lands. Without
         that clearing this paint outlives its purpose and clips the page's
         gradient to the height of its content; the rule beside it says so at
         length. -->
    <script>
      (function () {
        var BG = {
          midnight: '#0b1220',
          lavender: '#1c1b22',
          maroon: '#1d1319',
          powder: '#ffffff',
          dark: '#121314',
          light: '#ffffff',
        };
        var SCHEME = {
          midnight: 'dark',
          lavender: 'dark',
          maroon: 'dark',
          powder: 'light',
          dark: 'dark',
          light: 'light',
        };
        /* `dark` rather than `midnight`, and the attribute is stamped either
           way. `:root` in the stylesheet is still Midnight — it is the block
           every theme redeclares tokens against — so the default is no longer
           the palette a bare document draws, and an unstamped `<html>` would be
           a reader who has never chosen looking at the wrong one. Kept in step
           with `DEFAULT_THEME` and `applyTheme` in client/src/theme.ts. */
        var id = 'dark';
        try {
          var saved = localStorage.getItem('sicko:theme');
          if (saved && BG[saved]) id = saved;
        } catch (e) {
          /* a browser refusing storage gets the default */
        }
        document.documentElement.setAttribute('data-theme', id);
        document.documentElement.style.colorScheme = SCHEME[id];
        var meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) meta.content = SCHEME[id];
        /* `--bg` again — the value this script already paints the root with.
           `applyTheme` writes the identical line, so the two stay in step the
           way the two `color-scheme` writes do. */
        var tint = document.querySelector('meta[name="theme-color"]');
        if (tint) tint.content = BG[id];
        var style = document.createElement('style');
        style.textContent = 'html{background:' + BG[id] + '}';
        document.head.appendChild(style);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
